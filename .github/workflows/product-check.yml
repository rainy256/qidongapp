name: Product foundation checks
on:
  push:
    paths:
      - 'product/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/product-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:product
      - run: npm run build:product
      - uses: actions/upload-artifact@v4
        with:
          name: product-web-foundation
          path: dist-product/
          if-no-files-found: error
