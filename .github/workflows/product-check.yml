name: Product foundation checks
on:
  push:
    paths:
      - 'product/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/product-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:product
      - run: npm run build:product
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: QIDONG_PRODUCT=1 npx cap add android
      - run: python3 scripts/patch-android.py && python3 product/android/patch-product.py && QIDONG_PRODUCT=1 npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: product-web-foundation
          path: |
            dist-product/
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
