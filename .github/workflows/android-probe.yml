name: Android probe
on:
  push:
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/android-probe.yml'
      - 'tests/**'
      - 'worker/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: rainy256/qidong
          ref: b318ce568e217eb757dd5ff15f94df42e292636e
          path: .upstream
          persist-credentials: false
      - name: Inventory and reuse original assets
        run: |
          git -C .upstream ls-files > upstream-inventory.txt
          mkdir -p public
          cp -a .upstream/public/art public/
          cp .upstream/src/styles/tokens.css src/upstream-tokens.css
          test -s public/art/hero-runner.png
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          VITE_PROBE_API: ${{ vars.VITE_PROBE_API }}
      - run: npx cap add android
      - run: python3 scripts/patch-android.py && npx cap sync android
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: qidongapp-probe-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            upstream-inventory.txt
          if-no-files-found: error
