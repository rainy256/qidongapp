name: Signed Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version (vX.Y.Z); creates tag after successful signing'
        required: true
permissions:
  contents: write
concurrency:
  group: qidongapp-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          fi
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: npm install --no-audit --no-fund
      - run: npm run test:product && npm run build:product
      - run: QIDONG_PRODUCT=1 npx cap add android
      - run: python3 scripts/patch-android.py && python3 product/android/patch-product.py && QIDONG_PRODUCT=1 npx cap sync android
      - run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Sign and verify release APK
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 product/scripts/sign-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: qidongapp-signed
          path: |
            qidongapp.apk
            qidongapp.apk.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace signed assets.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --title "启动！ $RELEASE_TAG" --generate-notes qidongapp.apk qidongapp.apk.sha256
