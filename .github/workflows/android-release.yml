name: Signed Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing semantic version tag (vX.Y.Z)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          git show-ref --verify "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: npm install --no-audit --no-fund
      - run: npm run test:product && npm run build:product
      - run: QIDONG_PRODUCT=1 npx cap add android
      - run: python3 scripts/patch-android.py && python3 product/android/patch-product.py && QIDONG_PRODUCT=1 npx cap sync android
      - run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Sign and verify release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          keyfile="$RUNNER_TEMP/qidongapp-release.jks"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keyfile"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keyfile" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out qidongapp.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose qidongapp.apk
          sha256sum qidongapp.apk > qidongapp.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: qidongapp-signed
          path: |
            qidongapp.apk
            qidongapp.apk.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace signed assets.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "启动！ $RELEASE_TAG" --generate-notes qidongapp.apk qidongapp.apk.sha256
