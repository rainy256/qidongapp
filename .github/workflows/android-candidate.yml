name: Signed Android acceptance candidate
on:
  push:
    branches: ['main']
    paths: ['product/CANDIDATE_VERSION']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qidongapp-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate candidate version
        run: |
          RELEASE_TAG="$(cat product/CANDIDATE_VERSION)"
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "VITE_APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate signing configuration before APK build
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 product/scripts/sign-release.py --check
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: npm install --no-audit --no-fund
      - run: npm run test:product && npm run build:product
      - run: QIDONG_PRODUCT=1 npx cap add android
      - run: python3 scripts/patch-android.py && python3 product/android/patch-product.py && QIDONG_PRODUCT=1 npx cap sync android
      - run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Sign and verify release APK
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 product/scripts/sign-release.py
      - name: Verify upgrade compatibility against latest formal APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_TAG="$(gh release view --json tagName --jq .tagName)"
          mkdir -p "$RUNNER_TEMP/previous-apk"
          gh release download "$PREVIOUS_TAG" --pattern qidongapp.apk --pattern qidongapp.apk.sha256 --dir "$RUNNER_TEMP/previous-apk"
          (cd "$RUNNER_TEMP/previous-apk" && sha256sum -c qidongapp.apk.sha256)
          result="$(python3 product/scripts/verify-upgrade.py "$RUNNER_TEMP/previous-apk/qidongapp.apk" qidongapp.apk)"
          echo "$result"
          {
            echo "# 启动！$VITE_APP_VERSION 候选版验收"
            echo
            echo "升级起点：$PREVIOUS_TAG · 提交：$GITHUB_SHA"
            echo
            echo "自动校验：$result"
            echo
            cat qidongapp.apk.sha256
            echo
            cat docs/DEVICE_CHECK.md
          } > device-check.md
      - uses: actions/upload-artifact@v4
        with:
          name: qidongapp-signed-acceptance
          path: |
            qidongapp.apk
            qidongapp.apk.sha256
            device-check.md
          if-no-files-found: error
