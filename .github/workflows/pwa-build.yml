name: Publish PWA static build
on:
  push:
    branches: [main]
    paths: ['product/**','src/original/**','public/art/**','package.json','.github/workflows/pwa-build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qidong-pwa-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:product
      - run: python3 -m pip install --user Pillow
      - run: npm run build:pwa
      - name: Verify public build
        run: |
          test -s dist-pwa/index.html
          test -s dist-pwa/manifest.webmanifest
          test -s dist-pwa/sw.js
          test -s dist-pwa/icons/icon-512.png
          grep -q '/app/assets/' dist-pwa/index.html
      - name: Publish generated files to independent branch
        run: |
          set -euo pipefail
          git config user.name 'qidongapp-build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp -a dist-pwa "$RUNNER_TEMP/qidong-pwa"
          git fetch origin pwa-static && git worktree add --detach "$RUNNER_TEMP/pwa-tree" FETCH_HEAD || {
            git worktree add --detach "$RUNNER_TEMP/pwa-tree" HEAD
            cd "$RUNNER_TEMP/pwa-tree"
            git switch --orphan pwa-generated
            git rm -rf --ignore-unmatch .
          }
          cd "$RUNNER_TEMP/pwa-tree"
          cp -a "$RUNNER_TEMP/qidong-pwa/." .
          touch .nojekyll
          printf '%s\n' "$GITHUB_SHA" > BUILD_REVISION
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish PWA from $GITHUB_SHA"
          git push origin HEAD:refs/heads/pwa-static
